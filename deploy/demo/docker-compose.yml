name: cockpit-s3-demo

services:
  garage:
    image: dxflrs/garage:${GARAGE_VERSION:-v2.1.0}
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET (openssl rand -hex 32)}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN (openssl rand -base64 32)}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:?set GARAGE_METRICS_TOKEN (openssl rand -base64 32)}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  cockpit-s3:
    image: ghcr.io/pagliarinilucas/cockpit-s3:${COCKPIT_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - garage
    environment:
      NODE_ENV: production
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set ACCESS_TOKEN_SECRET (openssl rand -hex 32)}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_URL: ${PUBLIC_URL:-}
      COCKPIT_LICENSE_KEY: ${COCKPIT_LICENSE_KEY:-}
      DB_PATH: /data/cockpit.sqlite
      WEB_DIR: /app/public
      PORT: "3000"
      DEMO_MODE: "true"
      DEMO_RESET_MINUTES: ${DEMO_RESET_MINUTES:-60}
      DEMO_MAX_UPLOAD_BYTES: ${DEMO_MAX_UPLOAD_BYTES:-5242880}
      DEMO_S3_ENDPOINT: http://garage:3900
      DEMO_S3_REGION: garage
      DEMO_S3_ACCESS_KEY: ${DEMO_S3_ACCESS_KEY:-}
      DEMO_S3_SECRET_KEY: ${DEMO_S3_SECRET_KEY:-}
      DEMO_GARAGE_ADMIN_ENDPOINT: http://garage:3903
      DEMO_GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - cockpit_demo_data:/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  garage_meta:
  garage_data:
  cockpit_demo_data:
